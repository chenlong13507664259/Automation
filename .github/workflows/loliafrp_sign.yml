name: Lolia FRP 签到

on:
  schedule:
    - cron: '1 16 * * *'   
    - cron: '1 22 * * *'   
    - cron: '1 4 * * *'
    - cron: '1 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolia-checkin
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行签到脚本
        env:
          LOLIAFRP_ACCESS_KEY: ${{ secrets.LOLIAFRP_ACCESS_KEY }}
        run: python loliafrp_checkin.py
