name: ME Frp 每日签到

on:
  schedule:
    # 每天 UTC 16:01，北京时间 00:01
    - cron: '1 16 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行签到脚本
        env:
          MEFRP_ACCESS_KEY: ${{ secrets.MEFRP_ACCESS_KEY }}
        run: python mefrp_sign.py
